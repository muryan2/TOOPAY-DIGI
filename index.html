<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TooPay Digi - PPOB Mandiri</title>
    
    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830284.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-primary: #0f172a;
            --brand-accent: #38bdf8;
            --card-bg: #ffffff;
            --border-clr: #e2e8f0;
            --text-clr: #334155;
        }

        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 12px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .category-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--brand-primary);
            margin: 16px 0 8px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* 4 Kolom Dikunci Presisi */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .service-box {
            background: var(--card-bg);
            border: 1px solid var(--border-clr);
            border-radius: 12px;
            padding: 10px 2px;
            text-align: center;
            text-decoration: none;
            color: var(--text-clr);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75px;
            box-sizing: border-box;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .service-box:active {
            transform: scale(0.96);
            background-color: #f8fafc;
        }

        .service-box i {
            font-size: 1.25rem;
            color: #0284c7;
            margin-bottom: 5px;
        }

        .service-box span {
            font-size: 0.58rem;
            font-weight: 700;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appRoot">
        <!-- Render otomatis via JavaScript murni -->
    </div>

    <script>
        // Database Layanan Murni Tanpa Sisa Template Luar
        const appDatabase = {
            prepaid: [
                { title: "Pulsa", icon: "fa-mobile-screen-button" },
                { title: "Data", icon: "fa-wifi" },
                { title: "Games", icon: "fa-gamepad" },
                { title: "Voucher", icon: "fa-ticket" },
                { title: "E-Money", icon: "fa-wallet" },
                { title: "PLN", icon: "fa-bolt" },
                { title: "Paket SMS & TELP", icon: "fa-phone-volume" },
                { title: "Aktivasi Voucher", icon: "fa-qrcode" },
                { title: "TV", icon: "fa-tv" },
                { title: "Mass Aktif", icon: "fa-hourglass-half" },
                { title: "Aktivasi Perdana", icon: "fa-sim-card" }
            ],
            postpaid: [
                { title: "PLN Pascabayar", icon: "fa-lightbulb" },
                { title: "PDAM", icon: "fa-faucet-drip" },
                { title: "HP Pascabayar", icon: "fa-phone" },
                { title: "Internet Pascabayar", icon: "fa-globe" },
                { title: "BPJS", icon: "fa-suitcase-medical" },
                { title: "Multifinance", icon: "fa-file-invoice-dollar" },
                { title: "PBB", icon: "fa-landmark" },
                { title: "GAS", icon: "fa-fire-flame-simple" },
                { title: "BY.U", icon: "fa-signal" },
                { title: "TV Pascabayar", icon: "fa-satellite-dish" },
                { title: "E-Money", icon: "fa-credit-card" },
                { title: "Telkomsel OMNI", icon: "fa-tower-broadcast" },
                { title: "IndosatOnly4U", icon: "fa-network-wired" },
                { title: "TriCuanMax", icon: "fa-chart-line" },
                { title: "XL Axis Cuanku", icon: "fa-star" }
            ]
        };

        function buildAppInterface() {
            const container = document.getElementById('appRoot');
            
            let htmlContent = '';

            // Render Prabayar
            htmlContent += `<div class="category-title"><i class="fa-solid fa-bolt-lightning"></i> Layanan Prabayar</div>`;
            htmlContent += `<div class="service-grid">`;
            appDatabase.prepaid.forEach(item => {
                htmlContent += `
                    <a href="#" class="service-box" onclick="triggerService(event, '${item.title}')">
                        <i class="fa-solid ${item.icon}"></i>
                        <span>${item.title}</span>
                    </a>
                `;
            });
            htmlContent += `</div>`;

            // Render Pascabayar
            htmlContent += `<div class="category-title" style="margin-top: 22px;"><i class="fa-solid fa-file-invoice"></i> Layanan Pascabayar</div>`;
            htmlContent += `<div class="service-grid">`;
            appDatabase.postpaid.forEach(item => {
                htmlContent += `
                    <a href="#" class="service-box" onclick="triggerService(event, '${item.title}')">
                        <i class="fa-solid ${item.icon}"></i>
                        <span>${item.title}</span>
                    </a>
                `;
            });
            htmlContent += `</div>`;

            container.innerHTML = htmlContent;
        }

        function triggerService(e, serviceName) {
            e.preventDefault();
            console.log("Layanan dipilih: " + serviceName);
            // Tambahkan logika API / navigasi mandiri Anda di sini
        }

        document.addEventListener('DOMContentLoaded', buildAppInterface);

        // Service Worker PWA Mandiri
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('PWA Ready'))
                    .catch(err => console.log('PWA Error', err));
            });
        }
    </script>
</body>
</html>
