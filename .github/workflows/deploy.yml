# name: Deploy KloBot Reload
   on:
     push:
       branches: [ "main" ]
   jobs:
     deploy:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v3
         
         - name: Setup Node.js
           uses: actions/setup-node@v3
           with:
             node-version: '18'
             
         - name: Install dependencies
           run: npm install
           
         - name: Run tests (jika ada)
           run: npm test
           
         - name: Deploy to Railway
           uses: railwayapp/action@v1
           with:
             service: klobot-reload
             environment: production
           env:
             RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
             DIGIFLAZZ_USERNAME: ${{ secrets.DIGIFLAZZ_USERNAME }}
             DIGIFLAZZ_API_KEY: ${{ secrets.DIGIFLAZZ_API_KEY }}
             PORT: ${{ secrets.PORT }}
