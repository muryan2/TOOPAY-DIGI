name: Sync Digiflazz Products

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Sync Script
        env:
          DIGIFLAZZ_USERNAME: ${{ secrets.DIGIFLAZZ_USERNAME }}
          DIGIFLAZZ_KEY: ${{ secrets.DIGIFLAZZ_API_KEY_PRODUCTION }}
        run: node sync-products.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Digiflazz products [skip ci]" && git push)
