<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TooPay Digi - Pilihan Paket</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --brand-primary: #1b5e20;      /* Hijau Tua Tegas */
            --brand-accent: #2e7d32;       /* Hijau Standar Tegas */
            --brand-light: #e8f5e9;        /* Hijau Muda Soft */
            --card-bg: #ffffff;
            --border-clr: #c8e6c9;
            --text-clr: #263238;
        }

        body {
            background-color: #f4f9f4;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text-clr);
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 12px 80px 12px;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--brand-primary);
            margin: 10px 0 20px 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: var(--brand-light);
            color: var(--brand-primary);
            border: 1px solid var(--border-clr);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-clr);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: pointer;
            box-sizing: border-box;
            width: 100%;
        }

        .brand-card-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            color: var(--text-clr);
            font-size: 0.9rem;
        }

        .brand-card-info i {
            font-size: 1.4rem;
            color: var(--brand-accent);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="section-title">
        <button class="back-btn" onclick="kembaliKeHome()">
            <i class="fa-solid fa-arrow-left"></i> Kembali
        </button> 
        <span id="judul-brand">Memuat...</span>
    </div>

    <!-- Tempat Nominal Paket Muncul -->
    <div id="productListContainer" class="product-list">
        <p style="text-align: center; color: #78909c; font-size: 0.9rem; padding: 20px;">
            <i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan ke database Digiflazz...
        </p>
    </div>
</div>

<script>
    let globalProductsJson = [];

    // 1. Ambil parameter brand & kategori dari URL browser (dioper dari index.html)
    const urlParams = new URLSearchParams(window.location.search);
    const brandName = urlParams.get('brand');
    const categoryName = urlParams.get('category') || 'Pulsa';

    async function loadProductsJson() {
        try {
            // Ambil data dari file products.json hasil sinkronisasi backend Anda
            const res = await fetch('products.json');
            if (res.ok) {
                globalProductsJson = await res.json();
                renderFilteredProducts();
            }
        } catch (e) {
            document.getElementById("productListContainer").innerHTML = 
                '<p style="text-align:center; color:red; font-size:14px;">Gagal memuat products.json.</p>';
        }
    }

    // 2. Filter data secara akurat sesuai struktur Digiflazz Anda (product_name, brand, price)
    function renderFilteredProducts() {
        if (!brandName) {
            kembaliKeHome();
            return;
        }

        document.getElementById("judul-brand").innerText = brandName.toUpperCase();
        const container = document.getElementById("productListContainer");

        // Lacak & saring data berdasarkan brand dan kategori dari file products.json asli Anda
        const matchedProducts = globalProductsJson.filter(p => {
            if (!p) return false;
            const bName = brandName.toUpperCase();
            const pBrand = (p.brand || "").toUpperCase();
            const pName = (p.product_name || p.name || "").toUpperCase();

            const matchBrand = (pBrand && pBrand.includes(bName)) || (pName && pName.includes(bName));
            if (!matchBrand) return false;

            if (categoryName === "Pulsa") {
                if (pName.includes("VOUCHER") || pName.includes("AKTIVASI") || pName.includes("PERDANA")) {
                    return false;
                }
            }
            return true;
        });

        // Urutkan harga dari termurah
        matchedProducts.sort((a, b) => (a.price || 0) - (b.price || 0));
        container.innerHTML = "";

        if (matchedProducts.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#78909c; font-size:14px; width:100%;">Produk untuk ${brandName} tidak tersedia saat ini.</p>`;
            return;
        }

        // 3. Cetak produk menggunakan susunan class orisinal Anda
        matchedProducts.forEach(p => {
            const productName = p.product_name || p.name;
            const priceFormatted = new Intl.NumberFormat("id-ID", { 
                style: "currency", 
                currency: "IDR", 
                maximumFractionDigits: 0 
            }).format(p.price || 0);

            const kartu = document.createElement("div");
            kartu.className = "product-card";
            
            // Saat nominal dipilih, simpan ke localStorage dan kembali ke halaman utama
            kartu.onclick = function() {
                localStorage.setItem("item_terpilih_nama", productName);
                localStorage.setItem("item_terpilih_harga", priceFormatted);
                kembaliKeHome(true);
            };

            kartu.innerHTML = `
                <div class="brand-card-info">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <div style="display: flex; flex-direction: column; text-align: left;">
                        <h4 style="margin: 0; font-size: 14px; font-weight: bold;">${productName}</h4>
                        <span style="font-size: 11px; color: #78909c; font-weight: normal;">Proses Instan Otomatis</span>
                    </div>
                </div>
                <span style="color: var(--brand-accent); font-weight: 800; font-size: 14px; white-space: nowrap; margin-left: 10px;">${priceFormatted}</span>
            `;
            container.appendChild(kartu);
        });
    }

    function kembaliKeHome(bawaData = false) {
        window.location.href = "index.html" + (bawaData ? "?status=selected" : "");
    }

    window.onload = loadProductsJson;
</script>
</body>
</html>
